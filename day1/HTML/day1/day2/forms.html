<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/submit" method="POST">
        <h1>Basic Form</h1>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
      <br>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <br>
      <label for="password">
          Password 
        <input type="password" id="password" name="password" required>
      </label>
      <br>
      <label for="male">
        Male
        <input type="radio" id="male" name="gender" value="male">
      </label>
      <label for="female">
        Female
        <input type="radio" id="female" name="gender" value="female">
      </label>
      <br>
      <h3>Terms & Condtions</h3>
      <label>
        <input type="checkbox" name="terms" required/>
        I agree to Terms and Condtions
      </label>
      <br><br>
      <label for="department">
        Department
        <select id="department" name="department">
            <option value="ISE">ISE</option>
            <option value="CSE">CSE</option>
            <option value="MECH">MECH</option>
            <option value="CIV">CIV</option>
            <option value="AIML">AIML</option>
        </select>
      </label>
      <br>
      <label for="date">
          Date:
        <input type="date" id="birthday" name="birthday" required>
      </label><br>
      <textarea name="description" id="description">Description
      </textarea><br>
      <label for="video">Upload Video</label><br>
      <input type="file" name="video" id="video" accept="video/*"><br><br>
      <label for="pdf">Upload PDF</label><br>
      <input type="file" name="pdf" id="pdf" accept="Application/pdf"><br><br>
      <label for="pdf">Upload DOC</label><br>
      <input type="file" name="doc" id="doc" accept="Application/doc"><br><br>
      <label for="rating">give your rating</label>
      <input type="range" name="range" id="range" min="0" max="100"><br><br>
      <label for="rating">give your rating</label>
      <input type="color" name="color" id="color" min="0" max="100"><br><br>

      <input type="submit" value="submit">
    </form>
  </body>
</html>
